name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: 'jetbrains'
        java-version: 21
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build
      run: ./gradlew assembleDebug
    - name: Publish
      uses: actions/upload-artifact@v7
      with:
        path: app/build/outputs/apk/debug/flylogs-*-debug.apk
